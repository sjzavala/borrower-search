name: PR tests

on:
  pull_request:
    # `labeled`/`unlabeled` matter: adding the label to an open PR should re-run
    # selection rather than requiring a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Required: the selector diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Select the specs this diff can affect
        id: select
        uses: sjzavala/playwright-test-selector@v1
        with:
          test-dir: tests
          label: use-intelligent-runner
          comment: 'true'

      - run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run tests
        env:
          SPECS: ${{ steps.select.outputs.specs }}
        run: |
          # Unquoted on purpose: the selector emits a space-separated list of paths, and
          # an empty value correctly degrades to running the whole suite.
          #
          # @flake-demo is excluded here. That spec is deliberately non-deterministic (it
          # is the live fixture for flake-radar), and a flaky test has no business gating
          # anyone's merge. It runs on the trunk build instead, where being flaky is the
          # point — see flake-radar.yml.
          # shellcheck disable=SC2086
          npx playwright test $SPECS --grep-invert @flake-demo

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
