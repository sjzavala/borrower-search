# The trunk build, and the live demo for flake-radar.
#
# Three things happen here that do not happen in pr-tests.yml:
#
#   1. The deliberately flaky spec (@flake-demo) runs. It is excluded from the PR suite
#      because a flaky test must not gate a merge — but somewhere has to actually observe
#      it, or there is nothing to score.
#   2. Retries are on (playwright.config.js), so a retry that changes the outcome is
#      recorded. That transition is the strongest flake evidence there is.
#   3. Quarantined specs move to a second, non-blocking job rather than being skipped.
#      Skipping them would mean they can never produce the clean runs that release them,
#      and quarantine would become permanent.

name: Flake Radar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-list:
    name: Read the quarantine list
    runs-on: ubuntu-latest
    outputs:
      pattern: ${{ steps.read.outputs.pattern }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          pattern=''
          if [ -f .flake-radar/quarantine.json ]; then
            pattern=$(jq -r '[.tests[].title] | join("|")' .flake-radar/quarantine.json)
          fi
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
          echo "quarantined: ${pattern:-none}"

  blocking:
    name: Tests (blocking)
    needs: quarantine-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run everything except the quarantined specs
        env:
          QUARANTINED: ${{ needs.quarantine-list.outputs.pattern }}
        run: |
          set -euo pipefail
          if [ -n "$QUARANTINED" ]; then
            npx playwright test --grep-invert "$QUARANTINED"
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-blocking
          path: test-results/report.json
          if-no-files-found: ignore

  quarantined:
    name: Tests (quarantined, non-blocking)
    needs: quarantine-list
    if: ${{ needs.quarantine-list.outputs.pattern != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The point of the whole exercise: these failures must not gate the merge, but they
    # must still be observed, or nothing can ever earn its way out of quarantine.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run only the quarantined specs
        env:
          QUARANTINED: ${{ needs.quarantine-list.outputs.pattern }}
        run: npx playwright test --grep "$QUARANTINED"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-quarantined
          path: test-results/report.json
          if-no-files-found: ignore

  radar:
    name: Score and decide
    needs: [blocking, quarantined]
    # Runs even when the blocking job went red — a failing run is exactly the run whose
    # results are worth scoring.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the updated history back to main
      issues: write # opens, closes and escalates the quarantine issues
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: results-*
          path: results

      # Each job's report is ingested under its own run id, so the blocking and
      # non-blocking suites never overwrite one another in the history.
      - name: Ingest the blocking suite
        if: ${{ hashFiles('results/results-blocking/report.json') != '' }}
        uses: sjzavala/flake-radar@v1
        with:
          report: results/results-blocking/report.json
          run-id: ${{ github.run_id }}-blocking
          commit: 'true'

      - name: Ingest the quarantined suite
        if: ${{ hashFiles('results/results-quarantined/report.json') != '' }}
        uses: sjzavala/flake-radar@v1
        with:
          report: results/results-quarantined/report.json
          run-id: ${{ github.run_id }}-quarantined
          commit: 'true'
